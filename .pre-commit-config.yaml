repos:

- repo: https://github.com/scop/pre-commit-shfmt
  rev: v3.13.1-1
  hooks:
    - id: shfmt 
      stages: [pre-commit]

- repo: https://github.com/scop/pre-commit-shfmt
  rev: v3.13.1-1
  hooks:
    - id: shfmt-docker  
      stages: [pre-commit]

- repo: local
  hooks:
    - id: update-documentation
      name: Sync project documentation.
      entry: python .hooks/main.py --update_documentation
      fail_fast: true
      language: python
      additional_dependencies:
        - jinja2
        - semver
      files: README.md.jinja
      stages: [pre-commit]

- repo: local
  hooks:
    - id: testing
      name: Run Testing Suite.
      entry: main.bash
      language: unsupported_script
      fail_fast: true
      stages: [pre-commit, manual]
      pass_filenames: false

- repo: local
  hooks:
    - id: increment-version-by-patch
      name: Increment Container Version.
      entry: python .hooks/main.py --patch
      fail_fast: true
      language: python
      additional_dependencies:
        - jinja2
        - semver
      stages: [manual]
      args: [--project-root, "."]
      pass_filenames: false

- repo: local
  hooks:
    - id: increment-version-by-minor
      name: Increment Container Version.
      entry: python .hooks/main.py --minor
      fail_fast: true
      language: python
      additional_dependencies:
        - jinja2
        - semver
      stages: [manual]
      args: [--project-root, "."]
      pass_filenames: false

- repo: local
  hooks:
    - id: reset-semver-minor
      name: Set SemVer Minor to Zero
      entry: python .hooks/main.py --reset_minor
      fail_fast: true
      language: python
      additional_dependencies:
        - jinja2
        - semver
      stages: [manual]
      args: [--project-root, "."]
      pass_filenames: false

- repo: local
  hooks:
    - id: increment-version-by-major
      name: Increment Container Version.
      entry: python .hooks/main.py --major
      fail_fast: true
      language: python
      additional_dependencies:
        - jinja2
        - semver
      stages: [manual]
      args: [--project-root, "."]
      pass_filenames: false

- repo: local
  hooks:
    - id: increment-version-by-prerelease
      name: Increment Container Version.
      entry: python .hooks/main.py --pre
      fail_fast: true
      language: python
      additional_dependencies:
        - jinja2
        - semver
      stages: [manual]
      args: [--project-root, "."]
      pass_filenames: false

- repo: local
  hooks:
    - id: increment-version-by-build
      name: Increment Container Version.
      entry: python .hooks/main.py --build
      fail_fast: true
      language: python
      additional_dependencies:
