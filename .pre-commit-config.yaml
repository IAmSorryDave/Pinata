repos:

- repo: local
  hooks:
    - id: testing
      name: Run Testing Suite.
      entry: main.bash
      language: unsupported_script
      fail_fast: true
      stages: [pre-commit]

- repo: local
  hooks:
    - id: version
      name: Increment Container Version.
      entry: python .hooks/main.py --patch
      fail_fast: true
      language: python
      additional_dependencies:
        - semver
      stages: [manual]
      args: [--project-root, "."]
