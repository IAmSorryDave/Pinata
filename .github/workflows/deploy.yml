name: Build and Deploy to Docker Hub

on:
  pull_request:
    branches: main
    types: closed

jobs:

  increment:
  
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
    
      - uses: actions/checkout@v7

      - name: Check Current Version
        id: check_version
        shell: bash
        run: |
          CURRENT_VERSION=$(cat VERSION)
          if [[ "$CURRENT_VERSION" == *rc* ]]; then
            echo "rc=true" >> $GITHUB_OUTPUT
          else
            echo "rc=false" >> $GITHUB_OUTPUT
          fi

      - name: install-dependencies
        if: steps.check_version.outputs.rc == 'true'
        shell: bash
        run: |
          pip install pre-commit
          
      - name: setup
        if: steps.check_version.outputs.rc == 'true'
        shell: bash
        run: | 
          pre-commit install

      - name: Increment Major
        if: steps.check_version.outputs.rc == 'true'
        shell: bash
        run: |
          source ${GITHUB_WORKSPACE}/.scripts/versioning/increment-major.bash

      - name: Sync Minor
        if: steps.check_version.outputs.rc == 'true'
        shell: bash
        run: |
          source ${GITHUB_WORKSPACE}/.scripts/versioning/sync-semver-minor.bash

      - name: teardown
        if: steps.check_version.outputs.rc == 'true'
        shell: bash
        run: | 
          pre-commit uninstall

      - name: Extract Version
        if: steps.check_version.outputs.rc == 'true'
        id: version
        shell: bash
        run: |
          VERSION=$( cat VERSION )
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify Version Changed
        if: steps.check_version.outputs.rc == 'true'
        run: git diff --exit-code VERSION || echo "Version updated successfully"

      - name: Commit & Push Version Change
        uses: stefanzweifel/git-auto-commit-action@v7
        if: steps.check_version.outputs.rc == 'true'
        with:
          branch: main
          commit_message: "chore: bump development version to ${{ steps.version.outputs.version }}"
          file_pattern: VERSION

  push_to_registry:
    name: Push Docker image to Docker Hub
    needs: increment
    runs-on: ubuntu-latest
    env:
      ALTERNATE_REPO_NAME: ${{ secrets.DOCKER_USERNAME }} # In case where GitHub and Dockerhub usernames differ.
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ env.ALTERNATE_REPO_NAME }}
          password: ${{ secrets.DOCKER_PASSCODE }}

      - name: Load Image Tag
        id: tag
        shell: bash
        run: |
           source ${GITHUB_WORKSPACE}/.scripts/environment/init.bash
           echo "tag=$DOCKER_IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set Lowercase Repository Name
        id: repo_name
        run: echo "name=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Docker meta (use your tag as a raw tag)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.ALTERNATE_REPO_NAME }}/${{ steps.repo_name.outputs.name }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./image
          file: ./image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sync:
    name: Sync Hotfix Branch 🔄
    runs-on: ubuntu-latest
    needs: push_to_registry
    permissions:
      contents: write
  
    steps:
  
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
  
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
  
      - name: Sync Hotfix Branch
        run: |
          git fetch origin hotfix || true
          git checkout -B hotfix origin/main
          git push origin hotfix --force-with-lease

  cycle:
    name: Cycle Development 🔁 Version Bump ⬆️
    runs-on: ubuntu-latest
    needs: push_to_registry
    permissions:
      contents: write

    steps:

      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Development Branch
        run: |
          git fetch origin test-development || true
          git checkout test-development || git checkout -b development main
          git reset --hard main

      - name: Format UV Version
        id: format
        shell: bash
        run: |
          CURRENT_VERSION=$(cat VERSION)
          MAJOR=${CURRENT_VERSION:0:1}
          MINOR=$(find ./bats/tests -maxdepth 1 -mindepth 1 -type f | wc -l)
          PATCH=${CURRENT_VERSION:4:1}
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
    
      - name: Sync Semver
        shell: bash
        run: |
          echo ${{ steps.format.outputs.version }}
          echo ${{ steps.format.outputs.version }} > VERSION

      - name: Verify Version Changed
        run: git diff --exit-code VERSION || echo "Version updated successfully"

      - name: Commit & Push Version Change
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: test-development
          push_options: '--force-with-lease'
          commit_message: "chore: bump development version to ${{ steps.format.outputs.version }}"
          file_pattern: VERSION
